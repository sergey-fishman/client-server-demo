<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="List of users stored in the database">
    <link rel="stylesheet" href="css/styles.css">
    <title>Users</title>
</head>

<body>
    <header id="mainHeader">
        <div class="container">
            <h1>Users</h1>
            <nav><a href="index.html">&larr; Back to form</a></nav>
        </div>
    </header>

    <div class="container">
        <p id="usersMessage" class="message" role="status"></p>
        <table class="users-table" id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First name</th>
                    <th>Last name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- filled through users.js -->
            </tbody>
        </table>
    </div>

    <script src="js/name-rules.js"></script>
    <script src="js/users.js"></script>
</body>

</html>
